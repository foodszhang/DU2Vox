# Experimental / deprecated. Current mainline:
# configs/stage2/cqr_balanced_v2_rgl_main_multiview.yaml
# DU2Vox Stage 2 — CQR-v1.2 Boundary Halo + Distance-Shell Sentinel Multiview + MSE

experiment:
  name: "cqr_v1_2_boundary_shell_multiview_mse"

data:
  precomputed_train_dir: precomputed/cqr_v1_2_boundary_shell/train
  precomputed_val_dir: precomputed/cqr_v1_2_boundary_shell/val
  train_bridge_dir: output/bridge_20k_train/
  val_bridge_dir: output/bridge_20k_val/
  samples_dir: /home/foods/pro/FMT-SimGen/data/uniform_1000_20k/samples
  shared_dir: /home/foods/pro/FMT-SimGen/output/shared_mesh_20k
  train_split: /home/foods/pro/FMT-SimGen/data/uniform_1000_20k/splits/train.txt
  val_split: /home/foods/pro/FMT-SimGen/data/uniform_1000_20k/splits/val.txt
  n_query_points: 4096
  roi_padding_mm: 1.0

model:
  model_type: cqr_residual_inr
  prior_dim: 13
  n_freqs: 10
  hidden_dim: 256
  n_hidden_layers: 4
  skip_connection: true
  view_encoder: true
  view_feat_dim: 32
  fusion_method: "attn"
  encoder_base_channels: 32
  encoder_out_channels: 32
  view_encoder_lr_scale: 0.2

training:
  lr: 5.0e-5
  weight_decay: 1.0e-5
  batch_size: 8
  max_epochs: 200
  grad_clip_norm: 1.0
  num_workers: 2
  scheduler:
    type: "CosineAnnealingLR"
    T_max: 200
    eta_min: 1.0e-6
  early_stopping_patience: 30
  warmup_epochs: 5

loss:
  type: "mse"

logging:
  print_every: 1
  detail_every: 5

cqr:
  ratios:
    core: 0.55
    halo: 0.35
    sentinel: 0.05
    bg: 0.05
  coverage:
    tau_core: 0.50
    tau_weak: 0.08
    tau_boundary_low: 0.20
    tau_boundary_high: 0.50
    use_boundary_halo: true
    halo_layers: 1
    max_halo_tets_ratio: 0.40
    sentinel_score_quantile: 0.85
  sentinel:
    mode: distance_shell
    shell_min_mm: 0.0
    shell_max_mm: 8.0
    max_sentinel_tets_ratio: 0.10
