# DU2Vox Stage 2 - v2 3k RGL-CQR conservative sparse-support repair

experiment:
  name: cqr_v2_3k_rgl_main_conservative

stage1_operating_point:
  name: balanced_v2
  tau_active: 0.18
  tau_core: 0.65
  roi_dilation_layers: 0
  min_component_size: 3

data:
  dataset_root: /home/foods/pro/FMT-SimGen/data/fmt_simgen_v2_3k_20k
  samples_dir: /home/foods/pro/FMT-SimGen/data/fmt_simgen_v2_3k_20k/samples
  shared_dir: /home/foods/pro/FMT-SimGen/output/shared_mesh_20k
  train_split: /home/foods/pro/FMT-SimGen/data/fmt_simgen_v2_3k_20k/splits/train.txt
  val_split: /home/foods/pro/FMT-SimGen/data/fmt_simgen_v2_3k_20k/splits/val.txt
  test_split: /home/foods/pro/FMT-SimGen/data/fmt_simgen_v2_3k_20k/splits/test.txt

  train_max_samples: null
  val_max_samples: null
  test_max_samples: null

  train_bridge_dir: output/bridge_v2_3k_train_balanced_v2
  val_bridge_dir: output/bridge_v2_3k_val_balanced_v2
  test_bridge_dir: output/bridge_v2_3k_test_balanced_v2

  precomputed_train_dir: precomputed/cqr_v2_3k_rgl_main_conservative/train
  precomputed_val_dir: precomputed/cqr_v2_3k_rgl_main_conservative/val
  precomputed_test_dir: precomputed/cqr_v2_3k_rgl_main_conservative/test

  projection_file: proj.npz
  fallback_projection_file: null
  projection_norm: per_view_max
  projection_transform: none
  projection_eps: 1.0e-8

  n_query_points: 2048
  precompute_query_points: 32768
  resample_queries_each_epoch: true
  query_epoch_seed_stride: 1000003
  roi_padding_mm: 1.0

model:
  model_type: cqr_residual_inr
  prior_source: prior_lift
  prior_dim: 15
  residual_scale: 1.0

  use_lifting_adapter: false
  use_prolongation_adapter: false

  use_band_embedding: true
  band_embed_dim: 8
  num_bands: 5

  n_freqs: 10
  hidden_dim: 256
  n_hidden_layers: 4
  skip_connection: true
  view_encoder: true
  freeze_view_encoder: false
  view_feat_dim: 32
  fusion_method: attn
  encoder_base_channels: 32
  encoder_out_channels: 32
  view_encoder_lr_scale: 0.2
  view_projection_transform: none

  view_multiscale:
    enabled: true
    scales: ["s1", "s2", "s3"]
    fusion: concat_mlp
    hidden_dim: 64

training:
  batch_size: 1
  grad_accum_steps: 8
  amp: true
  amp_dtype: bf16
  lr: 5.0e-5
  weight_decay: 1.0e-5
  warmup_epochs: 5
  max_epochs: 120
  early_stopping_patience: 25
  grad_clip_norm: 1.0
  num_workers: 2
  scheduler:
    type: CosineAnnealingLR
    T_max: 120
    eta_min: 1.0e-6

loss:
  type: sparse_support
  bce_weight: 0.25
  dice_weight: 0.25
  mse_weight: 0.50
  pos_weight: 20.0
  support_threshold: 0.5
  residual_indicator_weight: 0.0

logging:
  print_every: 1
  detail_every: 5

cqr:
  name: correction_guided_query_refinement
  ratios:
    core: 0.40
    halo: 0.40
    bg: 0.15
    proposal: 0.05
    sentinel: 0.00

  lifting:
    tau_core: 0.65
    tau_halo: 0.18
    residual_halo_quantile: 0.80
    halo_residual_weight: 0.5
    weights:
      grad: 0.25
      jump: 0.30
      recovery: 0.25
      transition: 0.20

  measurement_proposal:
    enabled: true
    proposal_ratio: 0.05
    proposal_subdir: proposal
    proposal_filename: meas_backproj_heatmap.npy
    proposal_meta_filename: meas_backproj_meta.json
