# DU2Vox Stage 2 — V4 unified dual-evidence FEM corrector on the D1-Q cohort.
#
# This is the Experiment A / Experiment B config for the quantitative-source
# study. Every architectural and training choice is copied verbatim from
# unified_dual_evidence_fem_v4_2400.yaml; ONLY the data paths and the run name
# differ, so the D0 result and the D1-Q result are directly comparable.
#
# Frozen by construction (identical to D0 — do not retune for D1-Q):
#   - model variant/iterations/hidden_dim/context_blocks, view encoder, multiscale
#   - training seed, query count, batch size, AMP, lr, wd, grad clip, epochs
#   - loss weights, support temperature, Tversky alphas, data-consistency weight
#   - validation dense_interval
#
# Experiment A (no retraining): evaluate the D0-trained V4 checkpoint on the
# D1-Q test split using the paths below. The only thing that changed between
# train and test is the source field.
#
# Experiment B (retraining): train this same config from the same
# initialization checkpoint on the D1-Q train split, select/freeze on D1-Q val,
# then report D1-Q test.
#
# operator_cache is shared with D0 on purpose: it is a mesh-level operator and
# its recorded mesh_sha256 (718cb70f...) matches the current mesh.npz exactly,
# so the FEM/voxel discretization is bit-identical between D0 and D1-Q.

experiment:
  name: unified_dual_evidence_fem_v4_d1q_2400

runs_root: runs

data:
  dataset_root: /home/foods/pro/FMT-SimGen/data/fmt_simgen_v2_quantitative_gaussian_3k_20k
  samples_dir: /home/foods/pro/FMT-SimGen/data/fmt_simgen_v2_quantitative_gaussian_3k_20k/samples
  shared_dir: /home/foods/pro/FMT-SimGen/output/shared_mesh_20k
  # frame_manifest.json is rewritten on every DE generation run, so its hash is
  # not a stable identifier for the geometry. The geometry itself is pinned by
  # mesh.npz (see header) and the manifest's geometric fields are identical to
  # D0, so the stale hash is tolerated exactly as D0 does.
  allow_stale_frame_manifest: true
  frame_manifest_sha256: a89d36a52cc0d33e4764f6a65056a2dfa7fbe9fa55ed3458c0beb84d5ba31ee3
  train_split: /home/foods/pro/FMT-SimGen/data/fmt_simgen_v2_quantitative_gaussian_3k_20k/splits/train.txt
  val_split: /home/foods/pro/FMT-SimGen/data/fmt_simgen_v2_quantitative_gaussian_3k_20k/splits/val.txt
  test_split: /home/foods/pro/FMT-SimGen/data/fmt_simgen_v2_quantitative_gaussian_3k_20k/splits/test.txt
  train_bridge_dir: output/bridge_d1q_train
  val_bridge_dir: output/bridge_d1q_val
  test_bridge_dir: output/bridge_d1q_test
  operator_cache: experiments/cross_discretization_decomposition/artifacts/operator_cache
  # Continuous, per-sample-peak-normalized Pi_h targets. The binary variant in
  # precomputed/error_structured_projection_targets_d1q is the D0 contract and
  # is kept for Experiment A reproducibility.
  projection_targets_dir: precomputed/error_structured_projection_targets_d1q_continuous
  normalize_b: true
  use_visible_mask: false
  projection_file: proj.npz
  projection_norm: per_view_max
  projection_transform: none
  # Continuous-intensity supervision. `binary` (the D0 contract) thresholds the
  # GT and can only teach source support; `continuous` keeps the actual
  # fluorophore profile so per-focus amplitude and intra-source decay are
  # learnable. `per_sample_peak` divides each target by its own peak so the
  # cohort's 0.63-1.75 peak spread does not weight samples unequally.
  # These MUST match the flags used to build projection_targets_dir.
  gt_mode: continuous
  normalize_gt: per_sample_peak
  binary_threshold: 0.05
  # Share of the 8192 queries drawn from the signal region rather than
  # uniformly. Uniform sampling covers only ~1.4% of the source for these
  # samples, so the top 1% of queries averaged just 5% of the true peak; peak
  # and amplitude supervision would be aiming at the source edge. Halving the
  # queries to the signal fixes that while keeping half the field as a
  # background/context anchor. 0.0 reproduces the historical D0 sampling.
  signal_query_fraction: 0.5

model:
  variant: unified_dual_evidence_v4
  iterations: 3
  hidden_dim: 144
  context_blocks: 2
  max_neural_update: 0.25
  max_dc_update: 0.1
  view_encoder: true
  view_feat_dim: 32
  fusion_method: attn
  encoder_base_channels: 32
  encoder_out_channels: 32
  view_projection_transform: none
  view_multiscale:
    enabled: true
    scales: [s1, s2, s3]
    hidden_dim: 64

training:
  seed: 20260901
  n_query_points: 8192
  batch_size: 4
  num_workers: 4
  amp: true
  amp_dtype: bf16
  lr: 1.0e-4
  weight_decay: 1.0e-5
  grad_clip_norm: 1.0
  epochs: 25
  early_stopping_patience: 3
  initialization_checkpoint: runs/scale_calibrated_proximal_fem_v3_2400/checkpoints/best_dense_val_delta_dice.pth

loss:
  step_weights: [0.25, 0.5, 1.0]
  lambda_final_state: 1.0
  lambda_deep_supervision: 0.5
  lambda_projected: 0.5
  lambda_cosine: 0.0
  # Down from D0's 0.25. The support term binarizes the prediction with a
  # sigmoid gate, so on a continuous field it constrains only the support
  # boundary. It is kept small rather than removed so the reconstruction still
  # gets a boundary signal, but it no longer competes with intensity fitting.
  lambda_support: 0.05
  support_temperature: 0.1
  tversky_alpha: 0.5
  tversky_beta: 0.5
  lambda_data_consistency: 0.05
  residual_target_ratio: 1.1
  # ── Continuous-intensity terms (new for the quantitative study) ──────────
  # All act on the voxel-domain prediction against the continuous GT target.
  lambda_voxel_mse: 1.0
  # Scale-aware: prevents a high-yield sample from dominating the gradient.
  lambda_voxel_relative_l2: 0.5
  # Shape agreement, independent of overall amplitude.
  lambda_field_cosine: 0.25
  # Peak recovery, the headline quantitative target.
  lambda_peak: 0.25
  # Top-k fraction treated as "the peak" by the peak loss.
  peak_fraction: 0.01

validation:
  dense_interval: 5
