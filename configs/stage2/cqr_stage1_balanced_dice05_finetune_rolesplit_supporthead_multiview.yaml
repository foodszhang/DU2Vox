# Experimental / deprecated. Current mainline:
# configs/stage2/cqr_balanced_v2_rgl_main_multiview.yaml
# DU2Vox Stage 2 — CQR rolesplit on balanced Stage1 finetune bridge + support-head multiview

experiment:
  name: "cqr_stage1_balanced_dice05_finetune_rolesplit_supporthead_mv"

stage1_operating_point:
  name: stage1_balanced_dice05_finetune
  tau_active: 0.6
  tau_core: 0.65
  roi_dilation_layers: 0
  min_component_size: 0

data:
  train_bridge_dir: output/bridge_20k_train_stage1_balanced_dice05_finetune
  val_bridge_dir: output/bridge_20k_val_stage1_balanced_dice05_finetune
  precomputed_train_dir: precomputed/cqr_stage1_balanced_dice05_finetune_rolesplit/train
  precomputed_val_dir: precomputed/cqr_stage1_balanced_dice05_finetune_rolesplit/val

  samples_dir: /home/foods/pro/FMT-SimGen/data/uniform_1000_20k/samples
  shared_dir: /home/foods/pro/FMT-SimGen/output/shared_mesh_20k
  train_split: /home/foods/pro/FMT-SimGen/data/uniform_1000_20k/splits/train.txt
  val_split: /home/foods/pro/FMT-SimGen/data/uniform_1000_20k/splits/val.txt

  n_query_points: 8192
  roi_padding_mm: 1.0

model:
  model_type: cqr_residual_inr
  prior_dim: 13
  prior_source: prior_ext
  residual_scale: 1.0
  support_head: true
  output_mode: support
  hybrid_alpha: 0.5

  n_freqs: 10
  hidden_dim: 256
  n_hidden_layers: 4
  skip_connection: true
  view_encoder: true
  view_feat_dim: 32
  fusion_method: "attn"
  encoder_base_channels: 32
  encoder_out_channels: 32
  view_encoder_lr_scale: 0.2

training:
  lr: 5.0e-5
  weight_decay: 1.0e-5
  batch_size: 8
  max_epochs: 200
  grad_clip_norm: 1.0
  num_workers: 2
  scheduler:
    type: "CosineAnnealingLR"
    T_max: 200
    eta_min: 1.0e-6
  early_stopping_patience: 30
  warmup_epochs: 5

loss:
  type: "hybrid_support"
  mse_weight: 0.3
  bce_weight: 0.3
  dice_weight: 0.4
  support_threshold: 0.5

logging:
  print_every: 1
  detail_every: 5

cqr:
  ratios:
    core: 0.45
    halo: 0.45
    sentinel: 0.00
    bg: 0.10
  coverage:
    tau_core: 0.65
    tau_weak: 0.18
    halo_layers: 1
    sentinel_score_quantile: 0.85
    core_from_roi_weak: false
