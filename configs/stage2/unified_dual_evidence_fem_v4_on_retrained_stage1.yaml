experiment:
  name: unified_dual_evidence_fem_v4_on_retrained_stage1

runs_root: runs

data:
  dataset_root: /home/foods/pro/FMT-SimGen/data/fmt_simgen_v2_3k_20k
  samples_dir: /home/foods/pro/FMT-SimGen/data/fmt_simgen_v2_3k_20k/samples
  shared_dir: /home/foods/pro/FMT-SimGen/output/shared_mesh_20k
  allow_stale_frame_manifest: true
  frame_manifest_sha256: 25b77f5d11430ebf4d9735f19534782afb56f7fe5cab525a569028b0f3c02e2b
  train_split: /home/foods/pro/FMT-SimGen/data/fmt_simgen_v2_3k_20k/splits/train.txt
  val_split: /home/foods/pro/FMT-SimGen/data/fmt_simgen_v2_3k_20k/splits/val.txt
  test_split: /home/foods/pro/FMT-SimGen/data/fmt_simgen_v2_3k_20k/splits/test.txt
  train_bridge_dir: output/bridge_v2_3k_train_balanced_v2
  val_bridge_dir: output/bridge_stage1_retrain_2400_val
  test_bridge_dir: output/bridge_stage1_retrain_2400_test
  operator_cache: experiments/cross_discretization_decomposition/artifacts/operator_cache
  projection_targets_dir: precomputed/error_structured_projection_targets
  normalize_b: true
  use_visible_mask: false
  projection_file: proj.npz
  projection_norm: per_view_max
  projection_transform: none

model:
  variant: unified_dual_evidence_v4
  iterations: 3
  hidden_dim: 144
  context_blocks: 2
  max_neural_update: 0.25
  max_dc_update: 0.1
  view_encoder: true
  view_feat_dim: 32
  fusion_method: attn
  encoder_base_channels: 32
  encoder_out_channels: 32
  view_projection_transform: none
  view_multiscale:
    enabled: true
    scales: [s1, s2, s3]
    hidden_dim: 64

training:
  seed: 20260901
  n_query_points: 8192
  batch_size: 4
  num_workers: 4
  amp: true
  amp_dtype: bf16
  lr: 1.0e-4
  weight_decay: 1.0e-5
  grad_clip_norm: 1.0
  epochs: 25
  early_stopping_patience: 3
  initialization_checkpoint: runs/scale_calibrated_proximal_fem_v3_2400/checkpoints/best_dense_val_delta_dice.pth

loss:
  step_weights: [0.25, 0.5, 1.0]
  lambda_final_state: 1.0
  lambda_deep_supervision: 0.5
  lambda_projected: 0.5
  lambda_cosine: 0.0
  lambda_support: 0.25
  support_temperature: 0.1
  tversky_alpha: 0.5
  tversky_beta: 0.5
  lambda_data_consistency: 0.05
  residual_target_ratio: 1.1

validation:
  dense_interval: 5
