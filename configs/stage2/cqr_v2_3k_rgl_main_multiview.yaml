# DU2Vox Stage 2 — current RGL-CQR mainline on FMT-SimGen v2 3k/20k

experiment:
  name: cqr_v2_3k_rgl_main_multiview

stage1_operating_point:
  name: balanced_v2
  tau_active: 0.18
  tau_core: 0.65
  roi_dilation_layers: 0
  min_component_size: 3

data:
  precomputed_train_dir: precomputed/cqr_v2_3k_rgl_main/train
  precomputed_val_dir: precomputed/cqr_v2_3k_rgl_main/val
  train_bridge_dir: output/bridge_v2_3k_train_balanced_v2
  val_bridge_dir: output/bridge_v2_3k_val_balanced_v2

  samples_dir: /home/foods/pro/FMT-SimGen/data/fmt_simgen_v2_3k_20k/samples
  shared_dir: /home/foods/pro/FMT-SimGen/output/shared_mesh_20k
  train_split: /home/foods/pro/FMT-SimGen/data/fmt_simgen_v2_3k_20k/splits/train.txt
  val_split: /home/foods/pro/FMT-SimGen/data/fmt_simgen_v2_3k_20k/splits/val.txt

  n_query_points: 2048
  precompute_query_points: 32768
  roi_padding_mm: 1.0

model:
  model_type: cqr_residual_inr
  prior_source: prior_lift
  prior_dim: 15
  residual_scale: 1.0

  use_lifting_adapter: false
  use_prolongation_adapter: false

  use_band_embedding: true
  band_embed_dim: 8

  n_freqs: 10
  hidden_dim: 256
  n_hidden_layers: 4
  skip_connection: true
  view_encoder: true
  freeze_view_encoder: false
  view_feat_dim: 32
  fusion_method: attn
  encoder_base_channels: 32
  encoder_out_channels: 32
  view_encoder_lr_scale: 0.2

training:
  batch_size: 2
  grad_accum_steps: 4
  amp: true
  lr: 5.0e-5
  weight_decay: 1.0e-5
  max_epochs: 200
  warmup_epochs: 5
  early_stopping_patience: 30
  grad_clip_norm: 1.0
  num_workers: 2
  scheduler:
    type: CosineAnnealingLR
    T_max: 200
    eta_min: 1.0e-6

loss:
  type: mse_bce_dice
  mse_weight: 0.6
  bce_weight: 0.2
  dice_weight: 0.2
  support_threshold: 0.5
  residual_indicator_weight: 0.5

logging:
  print_every: 1
  detail_every: 5

cqr:
  name: correction_guided_query_refinement
  ratios:
    core: 0.45
    halo: 0.45
    sentinel: 0.00
    bg: 0.10

  lifting:
    tau_core: 0.65
    tau_halo: 0.18
    residual_halo_quantile: 0.80
    halo_residual_weight: 0.5
    weights:
      grad: 0.25
      jump: 0.30
      recovery: 0.25
      transition: 0.20
