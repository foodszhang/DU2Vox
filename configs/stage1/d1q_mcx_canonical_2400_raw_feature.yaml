# Diagnostic continuous Stage1 using the legacy normalized-adjoint feature.
# Because measurement and target are independently normalized, the third input
# channel is not a physically calibrated residual. It remains leakage-free and
# may be evaluated as a learned inverse feature, but must not be described as an
# exact data-consistency gradient.
experiment:
  name: stage1_d1q_mcx_canonical_2400_v2

data:
  shared_dir: /home/foods/pro/FMT-SimGen/output/shared_mesh_20k
  samples_dir: /home/foods/pro/DU2Vox/data/d1q_mcx_canonical_3k_20k/samples
  splits_dir: /home/foods/pro/DU2Vox/data/d1q_mcx_canonical_3k_20k/splits
  manifest_path: /home/foods/pro/DU2Vox/data/d1q_mcx_canonical_3k_20k/dataset_manifest.json
  normalize_b: true
  normalize_gt: true
  normalize_gt_mode: per_sample_file
  normalize_gt_scale_filename: gt_scale.npy
  binarize_gt: false
  use_visible_mask: false

model:
  name: GCAIN_full
  feat_dim: 6
  num_layer: 6
  k_neighbors: 32
  physics_evidence: raw

training:
  seed: 20260915
  batch_size: 8
  lr: 1.0e-3
  weight_decay: 1.0e-4
  max_epochs: 150
  grad_clip_norm: 1.0
  activation: leaky_relu_unbounded
  leaky_relu_slope: 0.01
  scheduler:
    type: CosineAnnealingWarmRestarts
    T_0: 50
    T_mult: 2
    eta_min: 1.0e-6
  early_stopping:
    patience: 20

loss:
  type: continuous_field
  source_threshold: 0.0
  source_mse_weight: 1.0
  global_mse_weight: 1.0
  relative_l2_weight: 0.25

checkpoint:
  primary_metric: val_loss

logging:
  print_every: 1
  detail_every: 10
  milestone_every: 50
  diag_epochs: 0
