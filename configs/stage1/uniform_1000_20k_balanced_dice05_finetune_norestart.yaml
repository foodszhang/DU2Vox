# DU2Vox Stage 1 — Balanced support finetune without LR restarts

experiment:
  name: "stage1_uniform_1000_20k_balanced_dice05_finetune_norestart"

data:
  shared_dir: /home/foods/pro/FMT-SimGen/output/shared_mesh_20k
  samples_dir: /home/foods/pro/FMT-SimGen/data/uniform_1000_20k/samples
  splits_dir: /home/foods/pro/FMT-SimGen/data/uniform_1000_20k/splits
  manifest_path: /home/foods/pro/FMT-SimGen/data/uniform_1000_20k/dataset_manifest.json
  normalize_b: true
  normalize_gt: false
  binarize_gt: true
  binarize_threshold: 0.05
  use_visible_mask: false

model:
  name: GCAIN_full
  feat_dim: 6
  num_layer: 6
  k_neighbors: 32

training:
  batch_size: 8
  lr: 2.0e-4
  weight_decay: 1.0e-4
  max_epochs: 200
  grad_clip_norm: 1.0
  activation: "sigmoid"
  leaky_relu_slope: 0.01
  scheduler:
    type: "CosineAnnealingLR"
    T_max: 200
    eta_min: 1.0e-6
  early_stopping: null

loss:
  type: "support"
  tversky_weight: 0.6
  tversky_alpha: 0.3
  tversky_beta: 0.7
  mse_weight: 0.2
  bce_weight: 0.2

checkpoint:
  primary_metric: "dice_bin_0.5"

logging:
  print_every: 1
  detail_every: 10
  milestone_every: 50
  diag_epochs: 3
